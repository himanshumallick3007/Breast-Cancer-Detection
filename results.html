<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Detection Results</title>
    <script src="./result.js" defer></script>
    <style>
        :root {
            --primary-color: #002349;
            --secondary-color: #0056b3;
            --light-color: #ffffff;
            --accent-color: #ff6b6b;
            --success-color: #28a745;
            --warning-color: #ffcc00;
            --danger-color: #ff4d4d;
            --gray-light: #f8f9fa;
            --gray: #e9ecef;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-color);
            background-image: linear-gradient(135deg, #002349 0%, #004080 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background: var(--light-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
        }
        
        h2 {
            color: var(--primary-color);
            margin: 10px 0;
            font-weight: 600;
        }
        
        .description {
            color: #555;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #666;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid var(--gray);
            border-top: 4px solid var(--secondary-color);
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            font-size: 18px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .positive {
            background-color: var(--danger-color);
            color: white;
        }
        
        .moderate {
            background-color: var(--warning-color);
            color: black;
        }
        
        .negative {
            background-color: var(--success-color);
            color: white;
        }
        
        .actions {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            border: none;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                </svg>
            </div>
            <h2>Breast Cancer Detection Results</h2>
            <p class="description">Our advanced AI algorithms have analyzed your medical reports to provide you with accurate results.</p>
        </div>
        
        <div class="loading">
            <div class="spinner"></div>
            <span>Analyzing your reports... Please wait.</span>
        </div>
        
        <div class="result" id="result-box"></div>
        
        <div class="actions">
            <a href="./Detection Methods.html" class="btn btn-primary">Return To Detection Page</a>
        </div>
        
        <div class="footer">
            <p>This analysis is intended as an assistive tool and should be reviewed by a healthcare professional.</p>
        </div>
    </div>
    
    <script>
        // This connects to your existing results.js file
        // Additional enhancement: show loading animation for a few seconds if needed
        setTimeout(() => {
            document.querySelector('.loading').style.display = 'none';
            // The rest of the functionality will be handled by your results.js file
        }, 2000);
    </script>
</body>
</html>
