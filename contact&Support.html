<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Support</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #002349;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background-color: #002349;
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        .header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }
        
        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 16px;
        }
        
        .form-container {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 15px;
        }
        
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        
        input:focus, textarea:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
            background-color: #fff;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #0056b3, #007BFF);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            background: linear-gradient(to right, #003d80, #0069d9);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .contact-info {
            background-color: #f0f7ff;
            border-top: 1px solid #e1e7f0;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            flex: 1 0 40%;
        }
        
        .contact-item i {
            margin-right: 10px;
            color: #0056b3;
            font-size: 18px;
        }
        
        .icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background-color: #0056b3;
            border-radius: 50%;
            color: white;
            text-align: center;
            line-height: 24px;
            margin-right: 10px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                max-width: 100%;
            }
            
            .contact-item {
                flex: 1 0 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Contact & Support</h2>
            <p>We're here to help. Reach out with any questions or concerns.</p>
        </div>
        
        <div class="form-container">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email address">
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="What is this regarding?">
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Tell us how we can help you..."></textarea>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </div>
        
        <div class="contact-info">
            <div class="contact-item">
                <span class="icon">✉</span>
                <span>support@yourcompany.com</span>
            </div>
            <div class="contact-item">
                <span class="icon">☎</span>
                <span>+1 (800) 123-4567</span>
            </div>
            <div class="contact-item">
                <span class="icon">⌚</span>
                <span>Mon-Fri: 9AM-5PM</span>
            </div>
            <div class="contact-item">
                <span class="icon">📍</span>
                <span>123 Business Ave, Suite 100</span>
            </div>
        </div>
    </div>
</body>
</html>
